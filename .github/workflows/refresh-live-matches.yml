name: Refresh Flashscore matches

on:
  workflow_dispatch:
  schedule:
    # Nadal co 30 minut, ale poza :00 i :30, gdy kolejka GitHub Actions
    # jest najbardziej obciążona i zaplanowane uruchomienia bywają opóźniane.
    - cron: "7,37 * * * *"

concurrency:
  group: refresh-flashscore-live
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape:live
        env:
          HEADLESS: "1"
          LIVE_REQUIRE_UPLOAD: "1"
          POINTEDGE_INGEST_URL: "https://www.pointedge.pl/api/cron/ingest-flashscore"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
