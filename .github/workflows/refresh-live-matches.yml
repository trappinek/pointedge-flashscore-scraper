name: Refresh Flashscore matches

on:
  workflow_dispatch:
  schedule:
    # Nadal co 30 minut, ale poza :00 i :30, gdy kolejka GitHub Actions
    # jest najbardziej obciążona i zaplanowane uruchomienia bywają opóźniane.
    - cron: "7,37 * * * *"

concurrency:
  group: refresh-flashscore-live
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Uruchom Tor z polskim wezlem wyjsciowym
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor curl
          TOR_DATA="$RUNNER_TEMP/pointedge-tor"
          TOR_CONFIG="$RUNNER_TEMP/pointedge-torrc"
          mkdir -p "$TOR_DATA"
          : > "$TOR_CONFIG"
          tor -f "$TOR_CONFIG" \
            --RunAsDaemon 1 \
            --DataDirectory "$TOR_DATA" \
            --SocksPort 19050 \
            --ExitNodes '{pl}' \
            --StrictNodes 1 \
            --Log "notice file $RUNNER_TEMP/pointedge-tor.log"

          echo "Oczekiwanie na pelne uruchomienie sieci Tor..."
          for attempt in $(seq 1 120); do
            if grep -q "Bootstrapped 100%" "$RUNNER_TEMP/pointedge-tor.log"; then
              echo "Tor osiagnal 100% gotowosci. Sprawdzanie kraju wyjscia..."
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Tor nie osiagnal gotowosci w wyznaczonym czasie."
              cat "$RUNNER_TEMP/pointedge-tor.log" || true
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 20); do
            country_json=$(curl --silent --show-error --max-time 15 \
              --socks5-hostname 127.0.0.1:19050 \
              https://api.country.is/ 2>/dev/null || true)
            country_iso=$(curl --silent --show-error --max-time 15 \
              --socks5-hostname 127.0.0.1:19050 \
              https://ifconfig.co/country-iso 2>/dev/null | tr -d '\r\n ' || true)
            if echo "$country_json" | grep -Eq '"country"[[:space:]]*:[[:space:]]*"PL"' \
              || [ "$country_iso" = "PL" ]; then
              echo "Tor gotowy: potwierdzony polski adres wyjsciowy."
              exit 0
            fi
            sleep 3
          done

          echo "Nie udalo sie zestawic polskiego wyjscia Tor. Dane nie zostana nadpisane."
          cat "$RUNNER_TEMP/pointedge-tor.log" || true
          exit 1
      - run: npm run scrape:live
        env:
          HEADLESS: "1"
          # Tor jest uzywany tylko przez przegladarke. Upload do PointEdge
          # pozostaje na zwyklym polaczeniu GitHub Actions.
          PROXY_SERVER: "socks5://127.0.0.1:19050"
          LIVE_REQUIRE_UPLOAD: "1"
          POINTEDGE_INGEST_URL: "https://www.pointedge.pl/api/cron/ingest-flashscore"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
